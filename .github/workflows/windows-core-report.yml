name: Build Windows core diagnostic

on:
  push:
    branches: [windows-core-compatibility]
    paths: [scripts/windows-core-report.cs, scripts/windows-core-access.cs, scripts/build-core-report.js, .github/workflows/windows-core-report.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch and verify the pinned official core for reference hashes
        run: node scripts/install-native-ci.js
      - name: Build and self-test the standalone diagnostic
        run: node scripts/build-core-report.js
      - uses: actions/upload-artifact@v4
        with:
          name: windows-core-diagnostic
          path: |
            dist/CIKE-Camoufox-Diagnostic-windows.zip
            dist/DIAGNOSTIC-SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: report
    if: github.repository == 'engeeeee/cike' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-core-diagnostic
          path: report-files
      - run: sha256sum --check --strict DIAGNOSTIC-SHA256SUMS.txt
        working-directory: report-files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.3-kernel-diagnostics.6
          target_commitish: ${{ github.sha }}
          name: Camoufox Windows 内核诊断工具
          prerelease: true
          make_latest: 'false'
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            report-files/CIKE-Camoufox-Diagnostic-windows.zip
            report-files/DIAGNOSTIC-SHA256SUMS.txt
          body: |
            用于定位「Camoufox 单独启动也出现 tab crashed」的 Windows 原生异常。

            下载并完整解压 `CIKE-Camoufox-Diagnostic-windows.zip`，双击 `CIKE-Core-Diagnostic.exe`。工具会自动检查权限、验证离线渲染，并短暂打开两个临时浏览器窗口。约一分钟、最多约两分钟后，将桌面生成的 `CIKE-Camoufox-report-日期时间.json` 发回；无需手动反复打开 CIKE。

            针对 `0xC0000022 / STATUS_ACCESS_DENIED` 检查 DLL 读取和执行权限（含低完整性启动令牌）、目录权限及强制完整性标签、Code Integrity / AppLocker / Defender 等相关拦截记录。本版补充目录权限继承标记，并显式输出强制完整性标签。在默认/软件离线渲染验证之外，分别观察默认/软件实际窗口的原生子进程，以区分无窗口测试与用户打开窗口的情况；窗口存在本身不会被当成页面渲染成功。仅 SHA-256 与官方基准一致的内核才会被自动测试。

            临时环境只打开本地 data: 页面，强制不可用的本机代理并禁止直连回退。原有浏览器沙箱保持启用；不打开已有环境，不读取 Cookie、密码或代理配置，不修改内核、文件权限、注册表或系统安全设置，不上传数据。测试进程独立放入 Windows Job，超时只清理本工具创建的进程树。

            **这是诊断工具，不是宣称已经修复内核崩溃的 CIKE 更新。** 内核基准文件来自校验过 SHA-256 的官方 158.0.1-beta.41 Windows 包，程序已在 Windows 构建并完成自检。应用正式版仍为 0.10.3。
