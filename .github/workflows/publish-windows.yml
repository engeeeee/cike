name: Publish Windows Release

"on":
  push:
    branches: [main]
    paths: [.github/workflows/publish-windows.yml]
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Windows build run ID
        type: string
        required: true
        default: '42453316414'
      tag:
        description: Windows release tag
        type: string
        required: true
        default: v0.10.1-windows.1

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || 'v0.10.1-windows.1' }}
  cancel-in-progress: false

env:
  SOURCE_RUN: ${{ inputs.source_run || '42453316414' }}
  RELEASE_TAG: ${{ inputs.tag || 'v0.10.1-windows.1' }}

jobs:
  release:
    if: github.repository == 'engeeeee/cike'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful Windows build
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = process.env.RELEASE_TAG;
            if (!/^\d+$/.test(process.env.SOURCE_RUN)) throw new Error('Invalid build run ID');
            if (!tag.startsWith(`v${version}-windows.`) || !/^v\d+\.\d+\.\d+-windows\.\d+$/.test(tag)) {
              throw new Error('Release tag must match the application version');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.SOURCE_RUN),
            });
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.path !== '.github/workflows/build-windows.yml') {
              throw new Error('The selected Windows build has not passed all checks');
            }
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!existing.draft) throw new Error('This release is already published');
            } catch (error) { if (error.status !== 404) throw error; }
            core.setOutput('sha', run.head_sha);
            core.setOutput('version', version);
            core.setOutput('filename', `CIKE-${version}-windows-x64.zip`);
            core.setOutput('build_url', run.html_url);
      - name: Confirm the artifact matches the application source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git diff --exit-code "$SOURCE_SHA" "$GITHUB_SHA" -- . \
            ':(exclude).github/workflows/publish-windows.yml' \
            ':(exclude)README.md' ':(exclude)docs/WINDOWS.md'
      - uses: actions/download-artifact@v4
        with:
          name: CIKE-windows-x64
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-files
      - name: Verify package checksum
        working-directory: release-files
        env:
          PACKAGE_NAME: ${{ steps.source.outputs.filename }}
        run: |
          test -s "$PACKAGE_NAME"
          sha256sum --check --strict SHA256SUMS.txt
      - name: Upload release files
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: CIKE ${{ steps.source.outputs.version }} Windows x64
          draft: true
          prerelease: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release-files/${{ steps.source.outputs.filename }}
            release-files/SHA256SUMS.txt
          body: |
            CIKE Windows x64 免安装版，基于 v${{ steps.source.outputs.version }}。

            - 适用于 Windows 10/11 的 Intel、AMD 64 位电脑。
            - 下载 `${{ steps.source.outputs.filename }}`，完整解压后双击 `CIKE.exe`；首次在「设置」下载 Chromium。
            - 数据默认保存在 `%LOCALAPPDATA%\CIKE`，程序更新时保留。

            修复 Camoufox 环境打开后提示「指纹内核窗口组件未能连接，请重试」并被关闭的问题。

            窗口同步改用每次启动独立的本机 IPv4 回环连接，并在 Firefox 和环境代理两层仅排除这一专用地址，避免本地域名解析及继承代理干扰。启动时生成新的扩展资源，连接超时后自动重试。窗口组件异常时保留浏览器，环境卡片显示同步提示，恢复后自动消失；网站请求继续使用当前环境代理。

            更新方法：完全退出旧版 CIKE 和所有环境，将新版完整解压到新目录，再启动 CIKE.exe。继续使用已有的 Camoufox 内核和环境，不需要重新下载内核、移动安装位置或删除环境。Cookie、登录数据和其他用户设置保留。

            0.10.0 的内核自定义位置、验证迁移和副本删除功能继续保留。[Windows 使用说明](https://github.com/engeeeee/cike/blob/${{ github.sha }}/docs/WINDOWS.md)。

            已通过 Windows CI：认证 SOCKS5 与继承代理设置下的窗口连接、连接阻断超过原 20 秒期限后继续运行、恢复连接和原生全屏、中文/空格路径和旧环境重开后的登录数据保留，以及原有代理、指纹、窗口、下载、内核管理、源码和打包应用回归。[验证记录](${{ steps.source.outputs.build_url }})。

            这是独立 Windows 移植版，未签名，更新需手动替换。校验文件见 `SHA256SUMS.txt`。
      - name: Publish the completed release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          PACKAGE_NAME: ${{ steps.source.outputs.filename }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            for (const name of [process.env.PACKAGE_NAME, 'SHA256SUMS.txt']) {
              if (!release.assets.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0)) {
                throw new Error(`Missing release file: ${name}`);
              }
            }
            const { data: published } = await github.rest.repos.updateRelease({
              ...context.repo, release_id, draft: false, make_latest: 'true',
            });
            core.info(`Published ${published.html_url}`);
