name: Build Windows x64

on:
  push:
    branches: [main, windows, 'windows-*', 'windows/**']
    paths-ignore: [README.md, 'docs/**', .github/workflows/publish-windows.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Install and verify pinned native fingerprint core
        run: node scripts/install-native-ci.js
      - run: npx playwright install chromium
      - name: Use full Chromium for regression tests
        shell: pwsh
        run: |
          $browser = node -p "require('playwright').chromium.executablePath()"
          "LFB_CHROMIUM_EXECUTABLE=$browser" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm test
      - name: Verify the requested detector with native hardware simulation
        if: ${{ !cancelled() }}
        run: node scripts/check-native-site.js
      - name: Verify native Windows window state and fullscreen inheritance
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 test/windows-window.test.js
      - name: Verify native fingerprint core window and fullscreen inheritance
        if: ${{ !cancelled() }}
        run: node --test test/kernel-window.test.js
      - name: Verify window reconnection and authenticated SOCKS startup in Unicode profiles
        if: ${{ !cancelled() }}
        run: node --test test/kernel-startup.test.js
      - name: Verify software graphics, automatic GPU fallback and new windows from a Chinese kernel path
        if: ${{ !cancelled() }}
        run: node --test test/kernel-graphics.test.js
      - name: Verify CIKE's Windows kernel installer
        if: ${{ !cancelled() }}
        run: node --test test/windows-runtime.test.js
      - name: Verify native kernel migration, deletion and retained login data
        if: ${{ !cancelled() }}
        run: node --test test/native-storage-runtime.test.js
      - run: npm run test:desktop
        if: ${{ !cancelled() }}
      - run: npm run pack:win-x64
        if: ${{ !cancelled() }}
      - name: Verify packaged Windows app
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:CIKE_TEST_APP = Join-Path $pwd 'dist/CIKE-win32-x64/CIKE.exe'
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: CIKE-windows-x64
          path: |
            dist/CIKE-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
