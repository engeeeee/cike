name: Build Windows x64

on:
  push:
    branches: [windows, 'windows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install chromium
      - name: Use full Chromium for regression tests
        shell: pwsh
        run: |
          $browser = node -p "require('playwright').chromium.executablePath()"
          "LFB_CHROMIUM_EXECUTABLE=$browser" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm test
      - name: Verify CIKE's Windows kernel installer
        run: node --test test/windows-runtime.test.js
      - run: npm run test:desktop
      - run: npm run pack:win-x64
      - name: Verify packaged Windows app
        shell: pwsh
        run: |
          $env:CIKE_TEST_APP = Join-Path $pwd 'dist/CIKE-win32-x64/CIKE.exe'
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: CIKE-windows-x64
          path: |
            dist/CIKE-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
